name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test tracking logic
        run: |
          javac -d /tmp/test src/main/java/com/slayertracker/core/*.java src/test/java/com/slayertracker/core/*.java
          java -cp /tmp/test com.slayertracker.core.SlayerLogicTest
      - name: Build
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: slayertracker-jar
          path: build/libs/*.jar
